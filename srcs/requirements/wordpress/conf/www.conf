[www]
user = www-data
group = www-data

; Escucha por TCP en el puerto 9000 de todas las interfaces del contenedor,
; para que NGINX (otro contenedor) pueda mandarle las peticiones PHP.
; Por defecto Debian usa un socket unix, que no se puede compartir entre contenedores.
listen = 9000

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Mantiene las variables de entorno del contenedor visibles para PHP
clear_env = no
