server {
    # Único punto de entrada de toda la infraestructura: 443 con TLS
    listen 443 ssl;
    listen [::]:443 ssl;

    # init.sh sustituye este marcador por el valor de DOMAIN_NAME del .env
    server_name DOMAIN_NAME_PLACEHOLDER;

    ssl_certificate     /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Mismo volumen que WordPress, montado en la misma ruta
    root /var/www/html;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Todo lo que sea PHP se reenvía a php-fpm en el contenedor wordpress
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
